name: Scrape venues

on:
  # Dagelijks om 02:00 UTC = 04:00 Amsterdam zomertijd / 03:00 wintertijd.
  # Bewust ruim voor 06:00 NL zodat social-generate (04:00 UTC) over
  # verse data beschikt en Diederik om 06:30 NL approved drafts kan
  # zien staan. Venues hebben hun ticketing-updates 's nachts al
  # gepubliceerd.
  schedule:
    - cron: '0 2 * * *'
  # Handmatig kunnen triggeren — handig voor backfills of als een
  # scrape mislukt is en we niet 24h willen wachten.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Theater-scraper (Concertgebouw alleen al ~3-4 min warm-run met
    # 4233 sitemap-entries) en ticketmaster (Wikipedia-summaries voor
    # nieuwe events) kunnen pieken — ruime timeout houdt ons safe.
    timeout-minutes: 30
    strategy:
      # Alle pure-HTTP-scrapers parallel — ze schrijven naar verschillende
      # venue-id's, geen conflict. `fail-fast: false` zorgt dat een crash
      # van één scraper de andere niet meeneemt. Playwright-scrapers
      # (paradiso, melkweg, muziekgebouw, ontheroof) draaien lokaal —
      # die zitten niet in de Dockerfile op Fly.
      fail-fast: false
      matrix:
        scraper: [stager, ical, jsonld, ticketmaster, theater, boomchicago, concertgemaal, wptheatre, p60, patronaat, ziggodome, ita, operaballet, podiummozaiek, celebratix, weeztix, shelter, sieraad, garagenoord, krakeling, eventscalendar, volkshotel, akhnaton, dezwijger, debalie, felixmeritis, rijksakademie, deceuvel, lima, perdu, nieuweboekhandel, eventbrite, aaservices, vrijburcht, munganga, westweelde, veronica, supper, gashouder, levenslang, clubup, ijland, odessa, fullhouse, bostheater, eye, kriterion, themovies, studiok, filmhallen, lab111, uitkijk, fchyena, rialto, cinecenter, cinemadevlugt, cavia]
        # Niet in cron: bimhuis, ot301, fourvenues, radioradio, ketelhuis, thepulse (Playwright, niet in Fly Dockerfile)
    steps:
      - name: POST /admin/api/scrapers/run/${{ matrix.scraper }}
        run: |
          # Per-scraper timeout 25 min. Theater met 20+ venues kan
          # tegen 9 min aanlopen; ruim genoeg houden voorkomt valse
          # falen. Individuele fetch-timeouts in de scrapers
          # voorkomen dat één hangende venue alles blokkeert.
          HTTP=$(curl --silent --show-error --max-time 1500 \
            -X POST "https://api.andreas.amsterdam/admin/api/scrapers/run/${{ matrix.scraper }}" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0

  # OMDb enrichment — vult description, image en genres aan voor
  # Film-events die nog gaps hebben (nieuw gescrapete obscure films,
  # festival-titels die OMDb ook niet kent worden geskipt). Runt ná
  # alle scrapers via `needs:`. fail-fast=false op de scrape-job
  # zorgt dat één gefaalde venue niet de enrichment blokkeert.
  enrich-films:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: POST /admin/api/enrich-films-omdb
        run: |
          HTTP=$(curl --silent --show-error --max-time 1500 \
            -X POST "https://api.andreas.amsterdam/admin/api/enrich-films-omdb" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0

  # TMDb enrichment — vult posterUrl + stillUrl + trailerUrl voor
  # Film-events die nog gaps hebben. Veel completer dan OMDb voor
  # arthouse + year-disambiguatie + trailers. Mirrort images naar
  # Bunny. Runt parallel (na scrape) — geen volgorde-afhankelijkheid
  # met OMDb want ze raken verschillende velden.
  enrich-films-tmdb:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: POST /admin/api/enrich-films-tmdb
        run: |
          HTTP=$(curl --silent --show-error --max-time 1500 \
            -X POST "https://api.andreas.amsterdam/admin/api/enrich-films-tmdb" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0

  # Artists-enrichment — twee staps (zie _artists-enrich.ts):
  #   A) ensure-rows: alle lineup-namen krijgen een artist-record (snel,
  #      bulk-insert, geen MB-call). Doel: app kan altijd naar artist
  #      linken, ook voor long-tail-acts.
  #   B) MB-enrich: pak artists met enrichedAt:null OF stale, MB-search
  #      voor Spotify/Apple Music/Bandcamp/YouTube/official + bio +
  #      genre-tags. Limit cap'd door MB's 1200/uur rate-limit (3.5s
  #      throttle × 2 calls per artist = ~23 min voor 200).
  # Cron-window: 35 min job, curl wacht max 32 min op response.
  enrich-artists:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: POST /admin/api/enrich-artists
        run: |
          HTTP=$(curl --silent --show-error --max-time 1900 \
            -X POST "https://api.andreas.amsterdam/admin/api/enrich-artists?limit=200" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0

  # Genre-enrichment — twee staps. Stap 1 (keyword) is gratis en
  # pakt het meeste; stap 2 (AI fallback) handelt af wat na stap 1
  # nog leeg is. Beide idempotent. Runt na enrich-films zodat OMDb-
  # genres op films er al staan voor de keyword-pass.
  enrich-genres-keywords:
    needs: enrich-films
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /admin/api/enrich-genres-keywords
        run: |
          HTTP=$(curl --silent --show-error --max-time 600 \
            -X POST "https://api.andreas.amsterdam/admin/api/enrich-genres-keywords" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0

  enrich-genres-ai:
    needs: enrich-genres-keywords
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: POST /admin/api/enrich-genres-ai
        run: |
          HTTP=$(curl --silent --show-error --max-time 1500 \
            -X POST "https://api.andreas.amsterdam/admin/api/enrich-genres-ai" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0
