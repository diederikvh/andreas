name: Refresh IG token

# Dagelijks 03:30 UTC een no-op check: server refresht alleen als het
# token binnen 7 dagen vervalt. Lazy refresh-on-use in de publisher
# dekt het normale geval, maar als er een week geen publish gebeurt
# (vakantie, storing) zorgt deze cron dat 't token toch tijdig wordt
# verlengd.
#
# Vroeg in de nacht zodat 't klaar is voordat de generate-cron om 11:00
# UTC draait.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force refresh (negeert de 7-dagen-drempel)'
        required: false
        default: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /admin/api/social/refresh-token
        run: |
          QS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            QS="?force=1"
          fi
          HTTP=$(curl --silent --show-error --max-time 60 \
            -X POST "https://api.andreas.amsterdam/admin/api/social/refresh-token$QS" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0
