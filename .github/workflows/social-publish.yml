name: Publish scheduled IG-posts

# Twee posts per dag: 09:00 NL (morning) en 16:00 NL (evening). We
# polln alleen in de uur-windows daaromheen, niet de hele dag —
# zo blijven we ruim binnen de GH-Actions free tier voor private
# repos. Per slot 4 uur window × 6 polls/uur = 24 polls/dag.
#
# UTC-bereik:
#   zomertijd: 07:00 NL = 05:00 UTC, 16:00 NL = 14:00 UTC
#   wintertijd: 08:00 NL = 07:00 UTC, 16:00 NL = 15:00 UTC
# Cron `6-9,14-17` dekt beide seizoenen mét marge voor GH-vertraging.
on:
  schedule:
    - cron: '*/10 6-9,14-17 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /admin/api/social/publish-due
        run: |
          HTTP=$(curl --silent --show-error --max-time 540 \
            -X POST "https://api.andreas.amsterdam/admin/api/social/publish-due" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP ──"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0
