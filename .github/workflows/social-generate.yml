name: Generate social-post drafts

# Dagelijks om 04:00 UTC = 06:00 Amsterdam zomertijd (05:00 winter)
# genereren we één carousel-draft voor het dag-thema (ma=theater,
# di=live muziek, …). Diederik approveert vóór de publish-cron 'm
# om 16:00 NL oppakt.
#
# `theme`-input is optioneel — leeg = vandaag's auto-thema.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Override theme-key (leeg = vandaag)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /admin/api/social/generate
        run: |
          URL="https://api.andreas.amsterdam/admin/api/social/generate"
          if [ -n "${{ inputs.theme }}" ]; then
            URL="$URL?theme=${{ inputs.theme }}"
          fi
          HTTP=$(curl --silent --show-error --max-time 540 \
            -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.ANDREAS_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "── HTTP $HTTP"
          python3 -m json.tool < response.json 2>/dev/null || cat response.json
          [ "$HTTP" -ge 400 ] && exit 1 || exit 0
