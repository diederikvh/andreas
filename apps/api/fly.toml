# Fly.io app config voor @andreas/api.
# Deploy: vanuit repo-root → `fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile`.

app = "andreas-api"
primary_region = "ams"

[build]
  # Dockerfile-pad relatief vanuit repo-root tijdens deploy. Fly past
  # de build-context automatisch aan op de directory waar je `fly
  # deploy` draait — dus run vanuit repo-root.

[env]
  PORT = "8787"
  BETTER_AUTH_URL = "https://api.andreas.amsterdam"
  PUBLIC_BASE_URL = "https://andreas.amsterdam"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb was te krap voor de nachtelijke scrape-sweep. Gereproduceerd op
  # 2026-08-23: zes scrapers draaien gelijktijdig in hetzelfde Node-proces
  # (de admin-endpoint roept ze in-process aan), en zodra theater z'n
  # zwaarste venue start — Concertgebouw, 4460 sitemap-URLs — tikt het
  # proces door de limiet:
  #
  #   Out of memory: Killed process 642 (node)  anon-rss: 402596kB
  #   Main child exited with signal 'SIGKILL'
  #
  # Elke request die dan openstaat krijgt synchroon een 502. Daarom
  # verloor de scrape-workflow sinds 12 aug elke dag 3-10 van z'n 64
  # jobs, telkens andere: puur wie er op dat moment in-flight was. Sentry
  # zag er niets van, want SIGKILL is niet op te vangen.
  #
  # Piek was 393mb, dus 1gb geeft ruime marge. Let op: dit koopt ruimte,
  # het maakt het probleem niet kleiner. De structurele fix is die 4053
  # Concertgebouw-pagina's niet ophalen — van de 4460 wordt 91% direct
  # weggegooid omdat alle datums voorbij zijn.
  memory = "1024mb"
  cpus = 1
